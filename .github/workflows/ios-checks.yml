name: iOS and shared tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/ios-garden-automatic-estimates, feature/ios-scheduled-morning-reminders]
  workflow_dispatch:

# [01] PR code can read the checkout, but does not get a signing key or permission to change the repo.
permissions:
  contents: read

concurrency:
  group: ios-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    # [02] The app uses the iOS 27 SDK. Keep the runner and Xcode choice visible when its image changes.
    runs-on: xcode-27
    timeout-minutes: 75
    defaults:
      run:
        shell: bash
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer

    steps:
      - name: Check out the proposed code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Java 17 for the shared model
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Check Xcode, prepare watchOS and choose an iOS 27.1 simulator
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dfe-test-results"
          test "$(uname -m)" = arm64
          xcodebuild -version | tee "$RUNNER_TEMP/dfe-test-results/toolchain.log"
          xcodebuild -showsdks | tee -a "$RUNNER_TEMP/dfe-test-results/toolchain.log"
          java -version 2>&1 | tee -a "$RUNNER_TEMP/dfe-test-results/toolchain.log"
          python3 --version | tee -a "$RUNNER_TEMP/dfe-test-results/toolchain.log"
          # [05] Xcode can ship different iOS and Watch SDK versions. Use the Watch SDK to choose its runtime.
          watch_sdk_version="$(xcrun --sdk watchsimulator --show-sdk-version)"
          watch_runtime_id="com.apple.CoreSimulator.SimRuntime.watchOS-${watch_sdk_version//./-}"
          echo "Watch Simulator SDK: $watch_sdk_version" | tee -a "$RUNNER_TEMP/dfe-test-results/toolchain.log"
          watch_runtime_available() {
            python3 - "$1" "$watch_runtime_id" <<'PY'
          import json
          import sys
          from pathlib import Path

          runtimes = json.loads(Path(sys.argv[1]).read_text())["runtimes"]
          ready = any(runtime.get("identifier") == sys.argv[2]
                      and runtime.get("isAvailable") is True
                      and "arm64" in runtime.get("supportedArchitectures", []) for runtime in runtimes)
          raise SystemExit(0 if ready else 1)
          PY
          }
          xcrun simctl list runtimes -j > "$RUNNER_TEMP/dfe-test-results/runtimes-before.json"
          if ! watch_runtime_available "$RUNNER_TEMP/dfe-test-results/runtimes-before.json"; then
            xcodebuild -downloadPlatform watchOS -buildVersion "$watch_sdk_version" -architectureVariant arm64 2>&1 \
              | tee "$RUNNER_TEMP/dfe-test-results/watch-runtime-download.log"
          fi
          xcrun simctl list runtimes -j > "$RUNNER_TEMP/dfe-test-results/runtimes.json"
          if ! watch_runtime_available "$RUNNER_TEMP/dfe-test-results/runtimes.json"; then
            echo "This runner needs an available arm64 watchOS $watch_sdk_version simulator runtime." >&2
            exit 1
          fi
          xcrun simctl list devices available -j > "$RUNNER_TEMP/dfe-test-results/simulators.json"
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          # [03] Start with a fresh simulator on the intended runtime. The runner's existing device failed data migration.
          results = Path(os.environ["RUNNER_TEMP"]) / "dfe-test-results"
          devices = json.loads((results / "simulators.json").read_text())["devices"]
          runtime = "com.apple.CoreSimulator.SimRuntime.iOS-27-1"
          phones = [device for device in devices.get(runtime, [])
                    if device.get("isAvailable") and "iPhone" in device["name"]]
          if not phones:
              raise SystemExit("This runner needs an available iOS 27.1 iPhone simulator.")
          phone = phones[0]
          simulator_id = subprocess.check_output([
              "xcrun", "simctl", "create", "DFE CI iPhone", phone["deviceTypeIdentifier"], runtime,
          ], text=True).strip()
          if not simulator_id:
              raise SystemExit("CoreSimulator did not return a device ID for the new iPhone.")
          with open(os.environ["GITHUB_ENV"], "a") as output:
              output.write(f"DFE_SIMULATOR_ID={simulator_id}\n")
          print(f'Test destination: fresh {phone["name"]} / iOS 27.1 ({simulator_id})')
          PY

      - name: Check policy copies and local tools
        run: |
          set -euo pipefail
          python3 -m unittest discover -s DigitalFootprintExplorer/iosApp/tests -v 2>&1 \
            | tee "$RUNNER_TEMP/dfe-test-results/python-tests.log"
          python3 DigitalFootprintExplorer/iosApp/scripts/generate_privacy_policy.py --check --include-web 2>&1 \
            | tee "$RUNNER_TEMP/dfe-test-results/privacy-check.log"

      - name: Run the shared model and controlled iOS tests
        env:
          DFE_BUILD_CACHE: ${{ runner.temp }}/dfe-build-cache
          GRADLE_USER_HOME: ${{ runner.temp }}/dfe-build-cache/gradle
          KONAN_DATA_DIR: ${{ runner.temp }}/dfe-build-cache/konan
          DFE_RESULT_BUNDLE: ${{ runner.temp }}/dfe-test-results/ios-tests.xcresult
        run: |
          set -euo pipefail
          bash DigitalFootprintExplorer/iosApp/scripts/ios-check.sh 2>&1 \
            | tee "$RUNNER_TEMP/dfe-test-results/ios-check.log"

      # [04] Keep the failure details too, so a reviewer can inspect the result instead of trusting a count.
      - name: Save test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ios-shared-test-results-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/dfe-test-results/
            DigitalFootprintExplorer/shared/build/test-results/iosSimulatorArm64Test/
            DigitalFootprintExplorer/shared/build/reports/tests/iosSimulatorArm64Test/
          if-no-files-found: warn
          retention-days: 14
