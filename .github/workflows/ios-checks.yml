name: iOS and shared tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/ios-garden-automatic-estimates, feature/ios-scheduled-morning-reminders]
  workflow_dispatch:

# [01] PR code can read the checkout, but does not get a signing key or permission to change the repo.
permissions:
  contents: read

concurrency:
  group: ios-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    # [02] This arm64 image carries the iOS 27 SDK. The repo can select another compatible runner.
    runs-on: ${{ vars.DFE_IOS_RUNNER || 'xcode-27' }}
    timeout-minutes: 75
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out the proposed code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Java 17 for the shared model
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Choose the toolchain and prepare the simulators
        run: |
          set -euo pipefail
          results="$RUNNER_TEMP/dfe-test-results"
          mkdir -p "$results"
          test "$(uname -m)" = arm64

          # [03] Start with the runner's Xcode and use another installed copy if its SDK is too old.
          selected="$(xcode-select -p 2>/dev/null || true)"
          export DEVELOPER_DIR=""
          for candidate in "$selected" /Applications/Xcode*.app/Contents/Developer; do
            [[ -d "$candidate" ]] || continue
            version="$(DEVELOPER_DIR="$candidate" xcodebuild -version 2>/dev/null)" || continue
            [[ "$version" =~ ^Xcode[[:space:]]+([0-9]+)\.([0-9]+) ]] || continue
            if (( BASH_REMATCH[1] > 27 || (BASH_REMATCH[1] == 27 && BASH_REMATCH[2] >= 1) )); then
              ios_sdk_version="$(DEVELOPER_DIR="$candidate" xcrun --sdk iphonesimulator --show-sdk-version)" || continue
              [[ "$ios_sdk_version" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]] || continue
              (( ${ios_sdk_version%%.*} >= 27 )) || continue
              watch_sdk_version="$(DEVELOPER_DIR="$candidate" xcrun --sdk watchsimulator --show-sdk-version)" || continue
              export DEVELOPER_DIR="$candidate"
              break
            fi
          done
          if [[ -z "$DEVELOPER_DIR" ]]; then
            echo 'This runner needs Xcode 27.1 or later with the iOS 27 and watchOS Simulator SDKs.' >&2
            exit 1
          fi
          printf 'DEVELOPER_DIR=%s\n' "$DEVELOPER_DIR" >> "$GITHUB_ENV"
          {
            printf 'Selected Xcode: %s\n' "$DEVELOPER_DIR"
            xcodebuild -version
            xcodebuild -showsdks
            java -version
            python3 --version
          } 2>&1 | tee "$results/toolchain.log"

          # [05] The embedded Watch app needs a runtime compatible with the selected Watch SDK.
          watch_runtime_available() {
            xcrun simctl list runtimes -j > "$results/runtimes.json" || return 1
            python3 - "$results/runtimes.json" "$watch_sdk_version" <<'PY'
          import json
          import sys
          from pathlib import Path

          runtimes = json.loads(Path(sys.argv[1]).read_text())["runtimes"]
          sdk_version = sys.argv[2].split(".")[:2]
          ready = any(runtime.get("identifier", "").startswith("com.apple.CoreSimulator.SimRuntime.watchOS-")
                      and runtime.get("version", "").split(".")[:2] == sdk_version
                      and runtime.get("isAvailable") is True
                      and "arm64" in runtime.get("supportedArchitectures", []) for runtime in runtimes)
          raise SystemExit(0 if ready else 1)
          PY
          }
          if ! watch_runtime_available; then
            # [07] Apple downloads can fail briefly. Try the download again without rerunning tests.
            for attempt in 1 2 3; do
              echo "Preparing watchOS runtime (attempt $attempt of 3)" | tee -a "$results/watch-runtime-download.log"
              if ! xcodebuild -downloadPlatform watchOS -buildVersion "$watch_sdk_version" -architectureVariant arm64 2>&1 \
                | tee -a "$results/watch-runtime-download.log"; then
                echo "Watch runtime download attempt $attempt failed." | tee -a "$results/watch-runtime-download.log"
              fi
              if watch_runtime_available; then
                break
              fi
              if [[ "$attempt" -lt 3 ]]; then
                sleep "$((attempt * 15))"
              fi
            done
          fi
          if ! watch_runtime_available; then
            echo "This runner needs an available arm64 watchOS $watch_sdk_version simulator runtime." >&2
            exit 1
          fi

          # [08] The general tests use an ordinary iPhone. The Duo runtime is checked separately.
          xcrun simctl list devices available -j > "$results/simulators.json"
          simulator_id="$(python3 DigitalFootprintExplorer/iosApp/scripts/select-ios-simulator.py \
            --standard-iphone-only --minimum-version 27.0 --sdk-version "$ios_sdk_version" \
            < "$results/simulators.json")"
          printf 'DFE_SIMULATOR_ID=%s\n' "$simulator_id" >> "$GITHUB_ENV"
          printf 'Test destination: %s\n' "$simulator_id" | tee -a "$results/toolchain.log"

      - name: Check policy copies and local tools
        run: |
          set -euo pipefail
          python3 -m unittest discover -s DigitalFootprintExplorer/iosApp/tests -v 2>&1 \
            | tee "$RUNNER_TEMP/dfe-test-results/python-tests.log"
          python3 DigitalFootprintExplorer/iosApp/scripts/generate_privacy_policy.py --check --include-web 2>&1 \
            | tee "$RUNNER_TEMP/dfe-test-results/privacy-check.log"

      - name: Prepare the Gradle wrapper
        working-directory: DigitalFootprintExplorer
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/dfe-build-cache/gradle
        run: |
          set -euo pipefail
          # [06] A short network failure during the wrapper download should not cancel the tests.
          for attempt in 1 2 3; do
            if ./gradlew --version; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep "$((attempt * 10))"
            fi
          done
          exit 1

      - name: Run the shared model and controlled iOS tests
        env:
          DFE_BUILD_CACHE: ${{ runner.temp }}/dfe-build-cache
          GRADLE_USER_HOME: ${{ runner.temp }}/dfe-build-cache/gradle
          KONAN_DATA_DIR: ${{ runner.temp }}/dfe-build-cache/konan
          DFE_RESULT_BUNDLE: ${{ runner.temp }}/dfe-test-results/ios-tests.xcresult
        run: |
          set -euo pipefail
          bash DigitalFootprintExplorer/iosApp/scripts/ios-check.sh 2>&1 \
            | tee "$RUNNER_TEMP/dfe-test-results/ios-check.log"

      # [04] Keep the failure details too, so a reviewer can inspect the result instead of trusting a count.
      - name: Save test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ios-shared-test-results-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/dfe-test-results/
            DigitalFootprintExplorer/shared/build/test-results/iosSimulatorArm64Test/
            DigitalFootprintExplorer/shared/build/reports/tests/iosSimulatorArm64Test/
          if-no-files-found: warn
          retention-days: 14
